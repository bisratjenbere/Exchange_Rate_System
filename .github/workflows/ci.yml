name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  # Explicitly set test database to prevent production access
  DATABASE_URL: "postgresql://test:test@localhost:5432/exchange_rate_test"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: exchange_rate_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install ruff mypy pytest-cov

    - name: Verify test database configuration
      run: |
        echo "DATABASE_URL is set to: ${DATABASE_URL}"
        if [[ "${DATABASE_URL}" != *"test"* ]]; then
          echo "ERROR: DATABASE_URL does not contain 'test'"
          exit 1
        fi
        if [[ "${DATABASE_URL}" == *"neon.tech"* ]]; then
          echo "ERROR: DATABASE_URL points to Neon production database. Refusing to run."
          exit 1
        fi

    - name: Lint with ruff (critical rules only)
      run: |
        ruff check . --select F,E --output-format=github
      continue-on-error: false

    - name: Lint with ruff (full report)
      run: |
        ruff check . --statistics
      continue-on-error: true

    - name: Type check with mypy
      run: |
        mypy . --ignore-missing-imports
      continue-on-error: true

    - name: Run tests with coverage
      run: |
        pytest tests/ \
          --cov=. \
          --cov-report=term-missing:skip-covered \
          --cov-report=xml \
          --cov-fail-under=78 \
          -v

    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      if: always()
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
      continue-on-error: true

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install bandit

    - name: Run security scan
      run: |
        bandit -r . -ll --exclude tests/,*.venv/,.venv/ -f json -o bandit-report.json || true
        bandit -r . -ll --exclude tests/,*.venv/,.venv/ || true
      continue-on-error: true

    - name: Upload security report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: bandit-security-report
        path: bandit-report.json
