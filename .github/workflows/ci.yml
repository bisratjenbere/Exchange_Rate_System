name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  # Explicitly set test database to prevent production access
  DATABASE_URL: "postgresql://test:test@localhost:5432/exchange_rate_test"

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: exchange_rate_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install ruff mypy radon pytest-cov bandit
    
    - name: Verify test database configuration
      run: |
        echo "DATABASE_URL is set to: ${DATABASE_URL}"
        if [[ "${DATABASE_URL}" != *"test"* ]]; then
          echo "ERROR: DATABASE_URL does not contain 'test'"
          exit 1
        fi
    
    - name: Lint with ruff (critical rules only)
      run: |
        # Fail on errors (F) and pycodestyle errors (E)
        # Warnings are reported but don't fail the build
        ruff check . --select F,E --output-format=github
      continue-on-error: false
    
    - name: Lint with ruff (full report)
      run: |
        ruff check . --statistics
      continue-on-error: true
    
    - name: Type check with mypy
      run: |
        mypy . --ignore-missing-imports
      continue-on-error: true
    
    - name: Run tests with coverage
      run: |
        pytest tests/ --cov=. --cov-report=term-missing:skip-covered --cov-report=xml -v
    
    - name: Check coverage threshold
      run: |
        # Baseline: 78% coverage, should not regress
        COVERAGE=$(grep -o 'line-rate="[0-9.]*"' coverage.xml | head -1 | grep -o '[0-9.]*')
        THRESHOLD=0.78
        if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
          echo "ERROR: Coverage $COVERAGE is below threshold $THRESHOLD"
          exit 1
        fi
        echo "Coverage $COVERAGE meets threshold $THRESHOLD"
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      if: always()
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
      continue-on-error: true

  security:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Install bandit
      run: pip install bandit
    
    - name: Run security scan
      run: |
        # Run with low-low severity, exclude tests
        bandit -r . -ll --exclude tests/,*.venv/,.venv/ -f json -o bandit-report.json || true
        bandit -r . -ll --exclude tests/,*.venv/,.venv/ || true
      continue-on-error: true
    
    - name: Upload security report
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: bandit-security-report
        path: bandit-report.json
