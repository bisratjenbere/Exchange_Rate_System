name: Scheduled Exchange Rate Scraper

on:
  schedule:
    - cron: '35 5,8,11 * * *'
    - cron: '5 7,13 * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps
      - name: Run collection job
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TZ: Africa/Addis_Ababa
        run: |
          python -m scheduler.run_job
      - name: Create database backup
        if: success()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          mkdir -p backups
          pg_dump "$DATABASE_URL" | gzip > backups/exchange_rates_backup_latest.sql.gz
      - name: Upload backup artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: neon-database-backup
          path: backups/exchange_rates_backup_latest.sql.gz
          retention-days: 30
