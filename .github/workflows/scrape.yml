name: Scheduled Exchange Rate Scraper

on:
  schedule:
    - cron: '35 5,8,11 * * *'
    - cron: '5 7,13 * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps
      - name: Run collection job
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TZ: Africa/Addis_Ababa
        run: |
          python -m scheduler.run_job
      - name: Create database backup
        if: success()
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -eo pipefail
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/postgresql.gpg
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-16
          mkdir -p backups
          DUMP_URL="${DATABASE_URL/-pooler/}"
          pg_dump "$DUMP_URL" | gzip > backups/exchange_rates_backup_latest.sql.gz
      - name: Upload backup artifact
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: neon-database-backup
          path: backups/exchange_rates_backup_latest.sql.gz
          retention-days: 30
